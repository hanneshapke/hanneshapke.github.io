<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div>&copy; {{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}</div>
    <ul>
      {% for s in site.social %}
        <li><a href="{{ s.link }}" rel="noopener"{% if s.link contains '://' %} target="_blank"{% endif %}>{{ s.name | downcase }}</a></li>
      {% endfor %}
    </ul>
  </div>
</footer>
