<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% assign page_title = page.title | default: site.title %}
  {% if page.url == "/" %}
    <title>{{ site.title }} — {{ site.tagline }}</title>
  {% else %}
    <title>{{ page_title }} · {{ site.title }}</title>
  {% endif %}

  {% assign page_desc = page.description | default: site.description %}
  <meta name="description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
