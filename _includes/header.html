<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | downcase }}</a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' or page.layout == 'post' %} class="is-active"{% endif %}>writing</a>
      <a href="{{ '/books/'   | relative_url }}"{% if page.url contains '/books'   %} class="is-active"{% endif %}>books</a>
      <a href="{{ '/talks/'   | relative_url }}"{% if page.url contains '/talks'   %} class="is-active"{% endif %}>talks</a>
      <a href="{{ '/about/'   | relative_url }}"{% if page.url contains '/about'   %} class="is-active"{% endif %}>about</a>
    </nav>
  </div>
</header>
